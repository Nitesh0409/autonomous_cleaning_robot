# Navigation Test Suite Definitions
scenarios:
  - name: "Scenario_1_ClearPath"
    start: { x: 0.0, y: 0.0, yaw: 0.0 }
    goal: { x: 4.0, y: 0.0 }
    description: "Simple straight line mission to verify basic reachability."

  - name: "Scenario_2_Slalom"
    start: { x: 0.0, y: 0.0, yaw: 0.0 }
    goal: { x: 4.0, y: -0.5 }
    description: "Requires navigating between Obstacle 1 and Obstacle 2."

  - name: "Scenario_3_BoundaryTest"
    start: { x: 0.0, y: 0.0, yaw: 0.0 }
    goal: { x: 2.5, y: 1.5 }
    description: "Tests the repulsion strength of Obstacle 1 (at 2, 0.5)."
